<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鲸语">
<title>鲸语</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索对话内容..." autocomplete="off">
    </div>
    <div id="convList"></div>
    <div class="side-foot">
      <div class="avatar" id="sideAvatar"></div>
      <div class="name" id="sideName"></div>
      <button class="icon-btn" id="openSettings" aria-label="设置">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </aside>

  <main id="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="菜单">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h18M4 13h18M4 19.5h8"/></svg>
      </button>
      <div class="title" id="chatTitle"></div>
      <button class="icon-btn" id="ttsBtn" aria-label="朗读"></button>
      <button class="icon-btn" id="newChatBtn" aria-label="新对话">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5a10.5 10.5 0 1 1-5.6 19.4L3.8 24.2l1.4-4.4A10.5 10.5 0 0 1 14 3.5z"/><path d="M14 9.5v9M9.5 14h9"/></svg>
      </button>
    </header>

    <div id="scroller">
      <div id="welcome">
        <div id="welcomeLogo"></div>
        <h1 id="welcomeText"></h1>
      </div>
      <div id="messages"></div>
    </div>
    <button id="toBottomBtn" class="hidden" aria-label="回到底部"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>

    <div id="composerWrap">
      <div class="composer">
        <div class="attach-strip hidden" id="attachStrip"></div>
        <textarea id="input" rows="1" placeholder="发消息或按住说话" enterkeyhint="send"></textarea>
        <div class="composer-row">
          <button class="chip" id="thinkChip">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(45 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
            <span class="lbl">深度思考</span>
          </button>
          <button class="chip" id="searchChip">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.8 4 6 4 9.5s-1.2 6.7-4 9.5c-2.8-2.8-4-6-4-9.5s1.2-6.7 4-9.5z"/></svg>
            <span class="lbl">智能搜索</span>
          </button>
          <div class="spacer"></div>
          <button class="round-btn" id="plusBtn" aria-label="附件"></button>
          <button class="round-btn" id="actionBtn" aria-label="发送"></button>
        </div>
      </div>
      <div id="attachPanel" class="hidden">
        <div class="tiles">
          <button class="tile" data-pick="camera">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7.5h3l1.6-2.5h6.8L17 7.5h3a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>拍照</button>
          <button class="tile" data-pick="album">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="17" rx="3.5"/><circle cx="15.5" cy="9" r="2"/><path d="m3.5 17 5-5 4 4 2-2 6 5"/></svg>相册</button>
          <button class="tile" data-pick="file">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m20 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/></svg>文件</button>
        </div>
        <p class="hint">支持图片、PDF、Word、PPT、Excel 和各种文本文件</p>
      </div>
      <p class="disclaimer">回答由 AI 生成，仅供参考</p>
    </div>
    <div id="mainMask"></div>
  </main>
</div>

<input type="file" id="pickCamera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="pickAlbum" accept="image/*" multiple class="hidden">
<input type="file" id="pickFile" multiple class="hidden">
<input type="file" id="pickImport" accept=".zip,.json,application/zip,application/json,text/plain" class="hidden">
<input type="file" id="pickBackup" accept=".json,application/json" class="hidden">
<input type="file" id="pickAvatar" accept="image/*" class="hidden">

<div id="layer"></div>
<div id="toast"></div>

<script>
/* 旧版系统 WebView 兼容：补几个新方法；版本过旧时提示更新 */
(function () {
  function def(o, k, f) { if (!o[k]) Object.defineProperty(o, k, { value: f, writable: true, configurable: true }); }
  function at(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; }
  def(Array.prototype, 'at', at); def(String.prototype, 'at', at);
  def(Object, 'hasOwn', function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); });
  def(Array.prototype, 'findLast', function (f) { for (var i = this.length - 1; i >= 0; i--) if (f(this[i], i, this)) return this[i]; });
  def(String.prototype, 'replaceAll', function (a, b) { return typeof a === 'string' ? this.split(a).join(b) : this.replace(a, b); });
  var m = navigator.userAgent.match(/Chrome\/(\d+)/);
  window.__oldWebView = m && +m[1] < 80;
  if (window.__oldWebView) document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;z-index:9999;background:#fff;color:#222;padding:80px 28px;font-size:16px;line-height:1.8';
    d.innerHTML = '<b style="font-size:20px">需要更新系统组件</b><br><br>你的手机里「Android System WebView」版本太旧（' + m[1] + '），鲸语无法正常显示。<br><br>请到应用商店搜索「Android System WebView」或「Chrome」并更新，然后重新打开鲸语。';
    document.body.appendChild(d);
  });
})();
</script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="files.js"></script>
<script src="db.js"></script>
<script src="importer.js"></script>
<script src="memory.js"></script>
<script src="brain.js"></script>
<script src="app.js"></script>
</body>
</html>
